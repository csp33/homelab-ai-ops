services:
  postgres:
    image: postgres:17-alpine
    container_name: homelab-aiops-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lyoko} -d ${POSTGRES_DB:-lyoko}"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lyoko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lyoko}
      POSTGRES_DB: ${POSTGRES_DB:-lyoko}
    env_file:
      - path: .env
        required: false

  homelab-mcp:
    build:
      context: .
      dockerfile: packages/mcps/homelab-mcp/Dockerfile
    container_name: homelab-aiops-mcp
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-8000}:8000"
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
    env_file:
      - path: .env
        required: false

  lyoko:
    build:
      context: .
      dockerfile: packages/agents/lyoko/Dockerfile
    container_name: homelab-aiops-lyoko
    restart: unless-stopped
    ports:
      - "${LYOKO_PORT:-9000}:9000"
    depends_on:
      postgres:
        condition: service_healthy
      homelab-mcp:
        condition: service_started
    environment:
      LYOKO_HOST: "0.0.0.0"
      LYOKO_PORT: "9000"
      MCP_SERVER_URL: "http://homelab-mcp:8000/mcp"
      POSTGRES_HOST: "postgres"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lyoko}
    env_file:
      - path: .env
        required: false

volumes:
  postgres_data:
