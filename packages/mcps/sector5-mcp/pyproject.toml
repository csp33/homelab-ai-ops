[project]
name = "sector5-mcp"
version = "0.1.0"
description = "FastMCP Tool Gateway and Safety Harness for Kubernetes, Home Assistant, UniFi, and Telegram"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Carlos Páez" }
]
dependencies = [
    "fastmcp>=4.0.10,<5.0.0",
    "ha-mcp>=8.6.0,<9.0.0",
    "unifi-network-mcp>=0.36.0,<1.0.0",
    "kubernetes>=36.0.0,<37.0.0",
    "pydantic>=2.13.0,<3.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "httpx>=0.28.0,<1.0.0",
    "python-dotenv>=1.2.0,<2.0.0",
    "google-auth>=2.59.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "uvicorn>=0.34.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sector5_mcp"]
